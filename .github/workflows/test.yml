name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch public test ROMs (not stored in the repo)
        run: sh scripts/fetch-test-roms.sh
      - name: Run tests
        run: node --test
